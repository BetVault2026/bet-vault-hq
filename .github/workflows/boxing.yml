
name: Refresh boxing data

on:
  schedule:
    - cron: '25 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch boxing data
        run: python update_boxing.py

      - name: Save updated boxing data
        run: |
          git config user.name "bet-vault-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boxing.json
          git diff --cached --quiet || (git commit -m "Refresh boxing data" && git pull --rebase origin main && git push)
