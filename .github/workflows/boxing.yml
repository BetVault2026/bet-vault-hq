
name: Refresh boxing data

on:
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxing-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python updater syntax
        run: python -m py_compile update_boxing.py
      - name: Fetch boxing data
        run: python update_boxing.py

      - name: Save updated boxing data
        run: |
          git config user.name "bet-vault-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boxing.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh boxing data"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
