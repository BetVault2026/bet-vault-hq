name: Refresh tennis data
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tennis-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh ATP and WTA
        env:
          ACES_API_KEY: ${{ secrets.ACES_API_KEY }}
        run: python update_tennis.py
      - name: Save tennis cache and usage
        if: always()
        run: |
          git config user.name "bet-vault-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tennis.json
          git diff --cached --quiet || (git commit -m "Refresh tennis data" && git push)
