
name: Refresh football data

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-cache-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch football data
        run: python update_football.py
      - name: Save updated fixtures
        run: |
          git config user.name "bet-vault-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/football.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football fixtures"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo "Failed to push updated football cache after retries" >&2
            exit 1
          fi
